<style>
/* VG: вырез экрана и «домашняя» полоса телефона не должны съедать управление
   и подписи HUD. Отступы добавляются только там, где вырез реально есть
   (env() = 0 на обычных экранах), поэтому вид игры не меняется. */
#joy{left:calc(clamp(14px,3vw,34px) + env(safe-area-inset-left,0px));
     bottom:calc(clamp(14px,4vh,40px) + env(safe-area-inset-bottom,0px))}
.touch-btns{right:calc(clamp(14px,3vw,34px) + env(safe-area-inset-right,0px));
     bottom:calc(clamp(14px,4vh,40px) + env(safe-area-inset-bottom,0px))}
.hud-top{padding-top:calc(clamp(8px,1.6vw,16px) + env(safe-area-inset-top,0px));
     padding-left:calc(clamp(8px,1.6vw,16px) + env(safe-area-inset-left,0px));
     padding-right:calc(clamp(8px,1.6vw,16px) + env(safe-area-inset-right,0px))}

/* VG: зелёная монета с белой буквой V — как в каталоге платформы. */
.vg-coin-chip{gap:5px}
.vg-coin-icon{width:14px;height:14px;border-radius:50%;flex:0 0 auto;position:relative;
  background:radial-gradient(circle at 34% 28%,#a8ffcf,#2fe07a 55%,#0f8f45);
  box-shadow:0 0 9px rgba(47,224,122,.75),inset 0 -1px 2px rgba(0,0,0,.35)}
.vg-coin-icon::after{content:"V";position:absolute;inset:0;display:grid;place-items:center;
  font:900 9px/1 "Trebuchet MS",Segoe UI,sans-serif;color:#fff;
  text-shadow:0 0 4px rgba(255,255,255,.85)}
/* На узком телефоне в правом верхнем углу теперь два счётчика — делаем чипы
   компактнее, чтобы ни один не уезжал за экран. */
@media (max-width:430px){
  .chip{padding:6px 10px;gap:7px;font-size:12px}
  .vg-coin-chip{padding:6px 9px}
  .vg-coin-icon{width:13px;height:13px}
}
</style>
</head>

</div>

<script>
/* VG: награда за забег по общему контракту платформы.
   Игра только считает собранные зелёные монеты V, сумму V определяет сервер
   по каталогу: ставка 3 V за монету, суточный лимит и правдоподобность по
   времени забега проверяются на сервере. Вне плеера (страница открыта
   напрямую) мост молчит, наград нет. */
(function () {
  var R = window.VGReward;
  if (!R || window.parent === window) return;
  var coins = 0, waiting = false;
  R.init('omnom', 3);
  function flush(reason) {
    R.set(coins);
    if (!coins || waiting) return;
    waiting = true;
    R.finish(reason || 'over');
  }
  window.VGCoin = {
    add: function (n) { coins += Math.max(1, n || 1); R.set(coins); },
    count: function () { return coins; },
    flush: function (reason) { flush(reason); }
  };
  /* Итог подтверждён — начинаем новый забег с чистым счётчиком, чтобы монеты,
     собранные после выплаты, тоже были оплачены (сервер считает каждый сеанс
     отдельно и повторно один и тот же не платит). */
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin) return;
    var data = event.data;
    if (!data) return;
    if (data.type === 'vg:flush') { flush('flush'); return; }
    if (data.type === 'gameSessionResult') { coins = 0; waiting = false; R.init('omnom', 3); }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush('hidden'); });
  window.addEventListener('pagehide', function () { flush('over'); });
})();
</script>
