e, a raw or burnt dish, wrong spices: 1 coin of compensation on serving. Discarding wastes the ingredients. Cooking pauses while the book is open.","Не удалось запустить 3D. Попробуй браузер с включённым WebGL.":"Could not start 3D. Try a browser with WebGL enabled.","Отправиться в путь →":"Set off →","ПЕШКОМ":"ON FOOT","Притянуть":"Pull","Пропустить (ошибка)":"Skip (mistake)","Рецепт заказчика":"The customer's recipe","Рюкзак":"Backpack","Рядом · 220 м":"Nearby · 220 m","Смотри во все стороны":"Look around","Сначала сядь в машину: F":"Get into the rover first: F","Снять":"Remove","Собрать · E":"Collect · E","ТЕКУЩИЙ ЗАКАЗ":"CURRENT ORDER","Твой рюкзак":"Your backpack","Телефон: тяни сцену одним пальцем. Два пальца: сведение — масштаб, вращение — поворот, совместное движение — сдвиг. Другой рукой можно двигать джойстик или удерживать нагрев.":"Phone: drag the scene with one finger. Two fingers: pinch to zoom, rotate to turn, drag together to pan. Your other hand can move the joystick or hold the heat.","Тяни вверх, чтобы посмотреть на небо, вниз — на землю. R или круговая стрелка возвращают камеру. WASD — движение · E — сбор/разговор · F — вход/выход из машины · K — кухня.":"Drag up to look at the sky, down at the ground. R or the round arrow resets the camera. WASD move · E collect/talk · F enter or leave the rover · K kitchen.","Управление камерой":"Camera controls","заказов":"orders","кухня.":"kitchen.","● ТЫ":"● YOU","Космокухня: Дороги Аурелии · VertGames":"Cosmic Kitchen: Roads of Aurelia · VertGames","Космокухня":"Cosmic Kitchen","Карта":"Map","Закрыть":"Close","15 соперников":"15 rivals","510 л.с. · RWD · 1 315 кг":"510 hp · RWD · 1 315 kg","G · Сервис / гараж":"G · Service / garage","NORTHPORT / СВОБОДНЫЙ РЕЖИМ":"NORTHPORT / FREE ROAM","NORTHPORT · РОЗЫСК":"NORTHPORT · WANTED","PINK SLIP / ТОЛЬКО ОТ 5 МАШИН":"PINK SLIP / FROM 5 CARS ONLY","REDLINE / МАСТЕРСКАЯ":"REDLINE / WORKSHOP","REDLINE — Розыск":"REDLINE — Wanted","АРЕСТ":"ARREST","Автомобили":"Cars","Аналоговый джойстик: вверх газ, вниз тормоз, влево и вправо руль":"Analogue stick: up for throttle, down for the brake, left and right to steer","БРИФИНГ / NORTHPORT":"BRIEFING / NORTHPORT","ВРЕМЯ":"TIME","Вернуть на дорогу":"Back on the road","Въезжай в Нортпорт на Spectre GTR. Впереди — встреча с Воссом, заезд на машины и чужие руки под капотом. Твоя история начинается здесь.":"Roll into Northport in the Spectre GTR. Ahead lies a meeting with the Boss, a pink-slip race and strange hands under the bonnet. Your story starts here.","ГАЗ ↑ &nbsp; РУЛЬ ↔ &nbsp; ↓ ТОРМОЗ":"THROTTLE ↑ &nbsp; STEER ↔ &nbsp; BRAKE ↓","Гараж / 10 машин":"Garage / 10 cars","Гараж / сервис":"Garage / service","Гонка и гараж":"Racing and the garage","Гонка на машину":"Race for a car","Город / радары":"City / speed traps","ДОРОГА К SPECTRE GTR":"THE ROAD TO THE SPECTRE GTR","Дальше →":"Next →","Двигатель на паузе":"Engine paused","Деньги, машины и тюнинг — отдельная экономика гонки. Монеты VertGames не списываются.":"Money, cars and tuning belong to the racing economy. VertGames coins are not charged.","До того, как всё изменилось":"Before everything changed","Доступно в Redline":"Available in Redline","Если полиция зажала тебя на малой скорости, заполняется шкала ареста. Арест — штраф и потеря BP текущей погони. Прокол ограничивает скорость до ремонта в гараже. Эвакуация добавляет 5 секунд к результату гонки, но не снимает розыск.":"If the police pin you at low speed, the arrest meter fills. An arrest costs a fine and the pursuit's BP. A puncture caps your speed until you repair in the garage. Recovery adds 5 seconds to the race result but does not clear the wanted level.","Жёлтые кольца — разрушаемые конструкции: пролетай через кольцо быстрее 45 км/ч, чтобы завалить дорогу позади. Замедление облегчает объезд шипов. Ручник помогает довернуть заднеприводную машину, но отнимает скорость.":"Yellow rings are breakable structures: fly through one faster than 45 km/h to block the road behind you. Slowing down makes dodging spikes easier. The handbrake helps rotate a rear-wheel-drive car but costs speed.","ЗАНОС":"DRIFT","Загрузка встроенного 3D-движка…":"Loading the built-in 3D engine…","Заезды":"Races","КМ/Ч":"KM/H","КУЗОВ / ШИНЫ":"BODY / TYRES","Как уйти":"How to escape","Левый джойстик: вверх — газ, вниз — тормоз/задний ход, в стороны — руль. Газ и руль независимы: диагональ не отнимает полный газ. Справа нитро, ручник и замедление. Свайп сцены — камера. Геймпад: левый стик — руль; RT / LT — газ/тормоз, A — нитро, B — ручник, X — замедление.":"Left stick: up is throttle, down is brake/reverse, sideways steers. Throttle and steering are independent: a diagonal does not cut full throttle. Nitro, handbrake and slowdown sit on the right. Swipe the scene to look around. Gamepad: left stick steers; RT / LT throttle and brake, A nitro, B handbrake, X slowdown.","Линия старта":"The start line","Личный стиль / бесплатно":"Personal style / free","Локальное автосохранение. Заезд начинается с линии старта. Гараж недоступен во время погони или гонки; эвакуация не снимает розыск.":"Saved locally. A race starts at the start line. The garage is unavailable during a pursuit or a race; recovery does not clear the wanted level.","Меню":"Menu","Меню → Город / радары: поставь метку на набережную, тоннель, старый квартал или пригород. Ищи быстрые длинные дуги, проходи радары на 80 / 120 / 160 км/ч. Руль прогрессивный: небольшое отклонение для скоростных поворотов, ручник для короткого заноса.":"Menu → City / speed traps: mark the embankment, the tunnel, the old quarter or the suburbs. Look for fast long curves and pass traps at 80 / 120 / 160 km/h. Steering is progressive: a small input for high-speed corners, the handbrake for a short drift.","Меню → Заезды или список соперников":"Menu → Races or the rivals list","Меню → Заезды. Заработай деньги на машине, не подходящей только по цвету: передний, задний и полный привод ведут себя по-разному. После заезда — награда по месту. В гараже можно бесплатно починиться, купить и настроить машину.":"Menu → Races. Earn money in a car chosen for more than its colour: front-, rear- and all-wheel drive behave differently. After a race you get a reward by position. In the garage you can repair for free, buy and tune cars.","Модели и лицензии · CC BY 4.0":"Models and licences · CC BY 4.0","НАЧАТЬ ИСТОРИЮ ↗":"START THE STORY ↗","НИТРО":"NITRO","На улицы ↗":"Onto the streets ↗","Найди свою линию":"Find your line","Начать погоню":"Start the pursuit","Не очищай данные браузера во время перевода. Если связь прервётся, повторное подтверждение завершит тот же обмен без нового списания. В отдельном HTML обмен недоступен.":"Do not clear the browser data during a transfer. If the connection drops, confirming again completes the same exchange without a second charge. The exchange is unavailable in the standalone HTML.","Не связана с Electronic Arts":"Not affiliated with Electronic Arts","Не только линия старта":"More than a start line","Новый Нортпорт":"A new Northport","Обмен кредитов":"Credit exchange","Обмен ₵ → V":"Exchange ₵ → V","Обменять":"Exchange","Оригинальная браузерная игра":"An original browser game","Открыть официальную страницу CC BY 4.0 ↗":"Open the official CC BY 4.0 page ↗","Отмена · без ставки":"Cancel · no stake","ПЕРЕТАЩИ МОДЕЛЬ ДЛЯ ОБЗОРА · КОЛЕСО / PINCH — МАСШТАБ":"DRAG THE MODEL TO LOOK AROUND · WHEEL / PINCH TO ZOOM","ПК":"PC","ПОГОНЯ":"PURSUIT","ПОСЛЕ ФИНИША":"AFTER THE FINISH","ПРОЛОГ / ПЕРВЫЙ ВЪЕЗД":"PROLOGUE / FIRST ARRIVAL","Победы и BP накапливаются. BP засчитываются, только если ты ушёл от полиции. Вызов следующему сопернику открывается после выполнения всех трёх условий.":"Wins and BP add up. BP only counts if you escaped the police. The next rival's challenge unlocks after all three conditions are met.","Подтверждаю ставку →":"Confirm the stake →","Полный текст CC BY 4.0 (встроен, английский)":"Full CC BY 4.0 text (embedded, English)","Помоги себе":"Help yourself","Последовательно <script id="game-i18n-runtime">
/* Переводы игр: пары data-ru/data-en и словарь динамических строк.
   Язык берётся из ?lang=, из localStorage (выбор на платформе) или из
   сообщения player:lang от родительской страницы. */
(function () {
  'use strict';
  var ATTRS = ['aria-label', 'title', 'placeholder', 'alt'];
  function detect() {
    try {
      var query = new URLSearchParams(location.search).get('lang');
      if (query === 'en' || query === 'ru') return query;
    } catch (e) {}
    try {
      var saved = localStorage.getItem('vg_lang');
      if (saved === 'en' || saved === 'ru') return saved;
    } catch (e) {}

  }
  var lang = detect();
  function dictionary(ru) {
    var table = window.VG_GAME_STRINGS || {};
    return table[ru] || null;
  }

  /* Игры пишут подписи из JS. textContent запоминаем вместе с переводом,
     чтобы при смене языка на лету перерисовать и такие строки. */
  var dynamic = window.__vgDynamic = [];
  var texts = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
  var nativeSet = texts && texts.set;

  function setText(node, value) {
    if (node.tagName === 'OPTION') { node.textContent = value; return; }
    node.innerHTML = value;
  }

  function apply(next) {
    lang = next === 'en' ? 'en' : 'ru';
    document.documentElement.setAttribute('lang', lang);
    var nodes = document.querySelectorAll('[data-ru]');
    for (var i = 0; i < nodes.length; i++) {
      var node = nodes[i];
      var text = node.getAttribute(lang === 'en' ? 'data-en' : 'data-ru');
      if (text == null) continue;
      if (node.tagName === 'OPTION') node.textContent = text;
      else node.innerHTML = text;
    }
    for (var d = 0; d < dynamic.length; d++) {
      var record = dynamic[d];
      if (!record.node || !record.node.parentNode) continue;
      if (record.node.getAttribute && record.node.getAttribute('data-ru')) continue;
      if (record.node.tagName === 'OPTION') record.node.textContent = lang === 'en' ? record.en : record.ru;
      else record.node.innerHTML = lang === 'en' ? record.en : record.ru;
    }
    var attrNodes = document.querySelectorAll('[data-aria-label-en],[data-title-en],[data-placeholder-en],[data-alt-en]');
    for (var j = 0; j < attrNodes.length; j++) {
      var el = attrNodes[j];
      for (var k = 0; k < ATTRS.length; k++) {
        var name = ATTRS[k];
        var english = el.getAttribute('data-' + name + '-en');
        if (english == null) continue;
        var store = 'data-' + name + '-ru';
        if (lang === 'en') {
          if (!el.hasAttribute(store)) el.setAttribute(store, el.getAttribute(name) || '');
          el.setAttribute(name, english);
        } else if (el.hasAttribute(store)) {
          el.setAttribute(name, el.getAttribute(store));
        }
      }
    }
  }

  if (nativeSet) {
    Object.defineProperty(Node.prototype, 'textContent', {
      configurable: true,
      enumerable: texts.enumerable,
      get: texts.get,
      set: function (value) {
        if (this.nodeType === 3 || typeof value !== 'string' || !/[А-Яа-яЁё]/.test(value)) {

      }
    });
  }

  }

<style>

/* === gaming dock: anchored translucent controls === */

/* Ландшафт: сетка «полотно + док» больше не режется флексом — док лежит поверх
   низа экрана, а полотно масштабируется по короткой стороне без искажений. */
@media(orientation:landscape) and (max-height:600px){
  .controls{grid-area:auto;position:fixed;left:0;right:0;bottom:0;height:auto;border-left:0;border-top:0}
  .controls .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .controls .dpad button{width:44px;height:44px}
  .board,.board-wrap{padding-bottom:76px}
}
@media(orientation:landscape) and (max-height:600px) and (min-width:760px){
  .controls .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
  .controls .dpad button{width:48px;height:48px}
}


/* Центр полотна свободен: полотно занимает всё, док просто лежит поверх низа. */
body>canvas,body>.board,body>.board-wrap{margin-bottom:0}
body[data-game="flappy"] .controls{justify-content:center}
body[data-game="flappy"] #btnJump{width:min(62%,320px)}
body[data-game="pong"] .controls{justify-content:space-between}
@media(max-height:460px){
  .controls{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));gap:8px}
  .controls button{height:44px;min-height:44px;min-width:44px;padding:6px 10px;font-size:12px}
}
</style>
<script id="game-controls-runtime">
/* Shared pointer controls for the six 2D games. No synthetic keyboard events. */
(function(){
 'use strict';
 const releases=new Set();
 const enabled=()=>!window.cheatPaused&&!document.querySelector('.overlay.show,.cheat-overlay.show');
 function element(id){return typeof id==='string'?document.getElementById(id):id}
 function hold(id,change){const b=element(id);let pointer=null,active=false;
  function release(){if(!active)return;active=false;pointer=null;b.classList.remove('pressed');change(false)}
  b.addEventListener('pointerdown',e=>{if(e.button!==0||pointer!==null||!enabled())return;e.preventDefault();pointer=e.pointerId;active=true;b.setPointerCapture(e.pointerId);b.classList.add('pressed');change(true)});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{if(e.pointerId===pointer)release()});
  // Keyboard activation of a focused on-screen button is also supported.
  b.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat&&enabled()){e.preventDefault();active=true;change(true);b.classList.add('pressed')}});
  b.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release()}});
  releases.add(release);return release;
 }
 function tap(id,action,allowOverlay=false){const b=element(id);let pointer=null;
  const allowed=()=>allowOverlay||enabled();
  function release(){pointer=null;b.classList.remove('pressed')}
  b.addEventListener('pointerdown',e=>{if(e.button!==0||pointer!==null||!allowed())return;e.preventDefault();pointer=e.pointerId;b.setPointerCapture(e.pointerId);b.classList.add('pressed');action()});
  for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,e=>{if(e.pointerId===pointer)release()});
  b.addEventListener('click',e=>{if(e.detail===0&&allowed())action()});
  releases.add(release);
 }
 function swipe(id,action){const c=element(id);let point=null;
  c.addEventListener('pointerdown',e=>{if(!enabled()||point)return;e.preventDefault();point={id:e.pointerId,x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});
  c.addEventListener('pointerup',e=>{if(!point||point.id!==e.pointerId)return;const dx=e.clientX-point.x,dy=e.clientY-point.y;point=null;if(!enabled()||Math.max(Math.abs(dx),Math.abs(dy))<22)return;action(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
  for(const event of ['pointercancel','lostpointercapture'])c.addEventListener(event,e=>{if(point?.id===e.pointerId)point=null});
  releases.add(()=>point=null);
 }
 function reset(){for(const release of releases)release()}
 function fitSquare(c){const wrap=c.parentElement,style=getComputedStyle(wrap);const w=wrap.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),h=wrap.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);const size=Math.max(1,Math.floor(Math.min(w,h,560)));c.style.width=c.style.height=size+'px'}
 window.VGInput={hold,tap,swipe,reset,fitSquare};
 addEventListener('blur',reset);addEventListener('resize',reset);document.addEventListener('visibilitychange',reset);
 document.addEventListener('DOMContentLoaded',()=>{
  for(const overlay of document.querySelectorAll('.overlay,.cheat-overlay'))new MutationObserver(()=>{if(overlay.classList.contains('show'))reset()}).observe(overlay,{attributes:true,attributeFilter:['class']});
  const square=document.querySelector('.board canvas,.board-wrap canvas');if(square){fitSquare(square);new ResizeObserver(()=>fitSquare(square)).observe(square.parentElement)}
 });
})();

</script>
</head>
<body data-game="flappy">
<div class="info">
  <div class="stat"><span class="l">SCORE</span><span class="v" id="scoreVal">0</span></div>
  <div class="stat"><span class="l">BEST</span><span class="v" id="bestVal">0</span></div>
  <div class="stat"><span class="l">COINS</span><span class="v" id="coinsVal">0 V</span></div>
</div>
<canvas id="c"></canvas>
<div class="controls" aria-label="Управление игрой" data-aria-label-en="Game controls"><button type="button" id="btnJump" class="primary-action" aria-label="Взмах" data-aria-label-en="Flap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 14 7-7 7 7M12 7v14"/></svg><span><span data-ru="Взмах" data-en="Flap">Взмах</span></span></button></div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>GAME OVER</h2>
    <p class="sub" id="sub"><span data-ru="Не повезло!" data-en="Bad luck!">Не повезло!</span></p>
    <div class="row"><span class="k">Score</span><span class="v" id="fScore">0</span></div>
    <div class="row"><span class="k">Best</span><span class="v" id="fBest">0</span></div>
    <div class="earn" id="fEarn">+0 V</div>
    <div class="btns">
      <button class="btn" onclick="restart()"><span data-ru="Играть снова" data-en="Play again">Играть снова</span></button>
      <button class="btn ghost" onclick="goHome()"><span data-ru="Домой" data-en="Home">Домой</span></button>
    </div>
    <p class="msg" id="fMsg"></p>
  </div>
</div>

<script>
window.cheatPaused=false;(function(){var MIN_W=320,MIN_H=240;var el=document.getElementById('cheatOverlay');var why=el?el.querySelector('.ch-why'):null;function ev(){var tooSmall=(window.innerWidth<MIN_W)||(window.innerHeight<MIN_H);var hidden=document.hidden===true;var paused=tooSmall||hidden;if(paused===window.cheatPaused)return;window.cheatPaused=paused;if(el){if(paused){if(why){why.textContent=hidden?((window.VGT&&window.VGT(((window.VGT&&window.VGT('Окно свёрнуто или скрыто','The window is minimised or hidden'))||'Окно свёрнуто или скрыто'),'The window is minimised or hidden'))||((window.VGT&&window.VGT('Окно свёрнуто или скрыто','The window is minimised or hidden'))||'Окно свёрнуто или скрыто')):((window.VGT&&window.VGT('Размер окна ниже допустимого','The window is smaller than the minimum size'))||'Размер окна ниже допустимого')}el.classList.add('show')}else el.classList.remove('show')}try{if(window.parent!==window)parent.postMessage({type:paused?'cheat_start':'cheat_end'},'*')}catch(e){}}document.addEventListener('visibilitychange',ev);window.addEventListener('resize',ev);window.addEventListener('focus',ev);ev()})();
</script>
<script>


const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let score=0,coins=0,best=Number(LS('nl_best_flappy'))||0,running=false;
const scan=document.getElementById('c'),ctx=scan.getContext('2d');
let bird,pipes,groundX,frame,stars,particles;
function size(){const oldHeight=scan.height;scan.width=scan.clientWidth;scan.height=scan.clientHeight;
  if(bird&&oldHeight>50){const ratio=(scan.height-50)/(oldHeight-50),maxY=scan.height-50;
    bird.y=Math.max(bird.r+2,Math.min(maxY-bird.r-2,bird.y*ratio));
    for(const p of pipes){const gap=Math.min(150,Math.max(70,(p.botY-p.topY)*ratio)),center=Math.max(gap/2+16,Math.min(maxY-gap/2-16,(p.topY+p.botY)/2*ratio));p.topY=center-gap/2;p.botY=center+gap/2}
  }
}
size();window.addEventListener('resize',size);

function init(){
  resizeCanvas();bird={x:80,y:scan.height/2,vy:0,r:16,rot:0,wing:0};pipes=[];groundX=0;frame=0;score=0;particles=[];
  stars=Array.from({length:60},()=>({x:Math.random()*scan.width,y:Math.random()*scan.height,s:Math.random()*1.6+.4}));
  document.getElementById('scoreVal').textContent=0;running=true;
}
function resizeCanvas(){size()}
const bestEl=document.getElementById('bestVal');bestEl.textContent=best;
const coinsEl=document.getElementById('coinsVal');
function jump(){if(running){bird.vy=-6.8;bird.rot=-.45}}
VGInput.tap('btnJump',jump);VGInput.tap(scan,jump);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();jump()}});
function addPipe(){const playable=scan.height-50,gap=Math.min(150,Math.max(70,playable*.45));const topY=24+Math.random()*Math.max(0,playable-gap-48);pipes.push({x:scan.width,topY:topY,botY:topY+gap,w:64,passed:false});}
const saveBest=()=>{if(score>best){best=score;LS('nl_best_flappy',best);bestEl.textContent=best}};
function update(){
  if(window.cheatPaused)return;
  if(!running)return;
  bird.vy+=.34;bird.y+=bird.vy;bird.wing=Math.sin(frame*.2)*6;
  if(bird.vy>0)bird.rot=Math.min(Math.PI/2,bird.rot+.05);
  if(bird.y+bird.r>scan.height-50||bird.y-bird.r<0)return gameOver();
  if(frame%95===0)addPipe();
  for(let i=pipes.length-1;i>=0;i--){const p=pipes[i];p.x-=2.6;
    if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;document.getElementById('scoreVal').textContent=score;addCoin(1)}
    if(bird.x+bird.r-5>p.x&&bird.x-bird.r+5<p.x+p.w){if(bird.y-bird.r+5<p.topY||bird.y+bird.r-5>p.botY)return gameOver()}
    if(p.x+p.w<-100)pipes.splice(i,1);}
  groundX=(groundX-2.6)%24;frame++;
}
function addCoin(n){coins+=n;coinsEl.textContent=coins+' V';if(window.parent!==window){try{parent.postMessage({type:'addCoins',amount:n},'*')}catch(e){}}}
function gameOver(){running=false;saveBest();document.getElementById('fScore').textContent=score;
  document.getElementById('fBest').textContent=best;document.getElementById('fEarn').textContent='+'+coins+' V';
  burst(bird.x,bird.y);document.getElementById('overlay').classList.add('show');try{parent.postMessage({type:'gameOver',score},'*')}catch(e){}}
function restart(){document.getElementById('overlay').classList.remove('show');init()}
function goHome(){try{parent.postMessage({type:'home'},'*')}catch(e){};var inFrame=false;try{inFrame=!!window.frameElement}catch(e){inFrame=true}if(!inFrame)try{window.location.href='../index.html'}catch(e){}}
function burst(x,y){for(let i=0;i<26;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:1,c:Math.random()>.5?'#2b99a0':'#3730a0'})}
function draw(){
  const g=ctx.createLinearGradient(0,0,0,scan.height);g.addColorStop(0,'#202a3a');g.addColorStop(1,'#1a2230');ctx.fillStyle=g;ctx.fillRect(0,0,scan.width,scan.height);
  ctx.fillStyle='rgba(255,255,255,.30)';stars.forEach(s=>{ctx.fillRect(s.x,s.y,s.s,s.s)});
  pipes.forEach(p=>{
    const grad=ctx.createLinearGradient(p.x,0,p.x+p.w,0);grad.addColorStop(0,'#2f4898');grad.addColorStop(.5,'#2f63a8');grad.addColorStop(1,'#2f4898');
    ctx.fillStyle=grad;ctx.fillRect(p.x,0,p.w,p.topY);ctx.fillRect(p.x-6,p.topY-24,p.w+12,24);
    ctx.fillRect(p.x,p.botY,p.w,scan.height-p.botY);ctx.fillRect(p.x-6,p.botY,p.w+12,24);
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(p.x+5,0,6,p.topY);ctx.fillRect(p.x+5,p.botY,6,scan.height-p.botY);
  });
  ctx.fillStyle='#1a2434';ctx.fillRect(0,scan.height-50,scan.width,50);
  ctx.fillStyle='#2b99a0';ctx.fillRect(0,scan.height-50,scan.width,3);
  ctx.strokeStyle='rgba(41,136,142,.35)';for(let x=groundX;x<scan.width;x+=24){ctx.strokeRect(x,scan.height-50,24,50)}
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.fillStyle='#2b99a0';ctx.strokeStyle='#10161f';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,bird.r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-5,bird.wing,10,7,-.2,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-5,6,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#10161f';ctx.beginPath();ctx.arc(8,-5,2.4,0,7);ctx.fill();
  ctx.fillStyle='#2f63a8';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(22,5);ctx.lineTo(10,10);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life-=.03;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)});ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}
function loop(){update();draw();requestAnimationFrame(loop)}
init();loop();
</script>
<div class="cheat-overlay" id="cheatOverlay"><div class="cheat-box"><div class="ic">🛡</div><h3><span data-ru="Окно слишком маленькое" data-en="The window is too small">Окно слишком маленькое</span></h3><p class="ch-why"><span data-ru="Игра приостановлена — размер окна ниже допустимого." data-en="The game is paused — the window is smaller than the minimum size.">Игра приостановлена — размер окна ниже допустимого.</span></p><p><span data-ru="Разверни окно или вернись на вкладку, чтобы продолжить." data-en="Maximise the window or return to the tab to continue.">Разверни окно или вернись на вкладку, чтобы продолжить.</span></p></div></div>
<script id="game-autofocus">
/* Автофокус игрового полотна: клавиатура работает сразу, без предварительного клика. */
(function () {
  function grab() {
    var target = document.querySelector('canvas[tabindex],#view,#c,#world,canvas,.board,.board-wrap');
    if (target && !target.hasAttribute('tabindex')) target.setAttribute('tabindex', '-1');
    try { if (target) target.focus({ preventScroll: true }); } catch (e) {}
    if (!target || document.activeElement !== target) {
      try { document.body.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  // Один клик по полю — тоже фокус (на случай, если браузер забрал его себе).
  document.addEventListener('pointerdown', function (e) {
    var target = e.target.closest && e.target.closest('canvas,#view,#c,#world');
    if (target) { try { target.focus({ preventScroll: true }); } catch (err) {} }
  }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(grab, 60); });
  else setTimeout(grab, 60);
  addEventListener('load', grab);
})();
</script>
