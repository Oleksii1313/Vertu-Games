[alembic]
# Alembic для Vertu Games.
#
#   export DATABASE_URL=postgresql://...        # Render Internal Database URL
#   alembic upgrade head                        # применить миграции
#   alembic current                             # что применено
#   alembic downgrade base                      # откатить всё (осторожно!)
#
# Начальная миграция 0001 создаёт всю схему; на существующей базе она
# помечается как применённая через `alembic stamp 0001`.

script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
