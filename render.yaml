# Blueprint для Render: web-сервис + PostgreSQL.
# Значения секретов задаются в панели Render (sync: false).
services:
  - type: web
    name: vertu-games
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 server:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: vertu-games-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_REQUIRED
        value: "1"
      - key: PUBLIC_URL
        sync: false

databases:
  - name: vertu-games-db
    plan: free
    databaseName: vertu
    user: vertu
